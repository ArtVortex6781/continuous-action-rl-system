[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-action-rl-system"
version = "0.1.0"
description = "Continuous-action reinforcement learning system"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rl_system*"]